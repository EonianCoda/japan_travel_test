<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>候選清單 - 大阪・京都之旅</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%); min-height: 100vh; }

/* Custom scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #a1a1a1; }

/* Tag pill style */
.tag-pill { display: inline-block; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 500; transition: all 0.2s; }
.tag-pill:hover { transform: scale(1.05); }

/* Card animations */
.item-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.item-card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px -4px rgba(0,0,0,0.1); }
.item-card.removing { opacity: 0.5; }

/* Responsive grid */
@media (max-width: 640px) {
  .items-grid { grid-template-columns: 1fr !important; }
}
</style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-6xl mx-auto">
<h1 class="text-2xl md:text-3xl font-bold text-center text-gray-800 mb-4">📋 候選清單</h1>

<div class="text-center mb-6">
    <a href="attractions.html" class="text-green-600 hover:underline font-medium">← 景點選擇器</a>
    <span class="text-gray-400 mx-2">|</span>
    <a href="foods.html" class="text-orange-500 hover:underline font-medium">美食選擇器 →</a>
</div>

<div class="bg-white/90 backdrop-blur rounded-2xl p-4 mb-6 shadow-lg border border-gray-100 flex flex-wrap justify-between items-center gap-4">
    <div class="text-gray-700">
        已選擇 <span id="totalCount" class="font-bold text-green-600">0</span> 個項目（<span id="attractionCount" class="font-bold">0</span> 個景點、<span id="foodCount" class="font-bold text-orange-500">0</span> 個美食）
    </div>
    <div class="flex gap-3">
        <button class="btn-clear px-5 py-2 rounded-xl text-white font-medium bg-red-500 hover:bg-red-600 transition-all" onclick="clearAll()">清除全部</button>
        <button class="btn-export px-5 py-2 rounded-xl text-white font-medium bg-green-500 hover:bg-green-600 transition-all" onclick="exportSelected()">📥 匯出 JSON</button>
    </div>
</div>

<div class="bg-white/90 backdrop-blur rounded-2xl p-4 mb-6 shadow-lg border border-gray-100">
    <div class="flex flex-wrap items-center gap-4">
        <div class="filter-group flex items-center gap-2">
            <label class="font-medium text-sm text-gray-700">類別：</label>
            <select id="typeFilter" onchange="renderItems()" class="px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
            <option value="all">全部</option>
            <option value="attraction">僅景點</option>
            <option value="food">僅美食</option>
        </select>
        </div>
        <div class="filter-group flex items-center gap-2">
            <label class="font-medium text-sm text-gray-700">城市/地區：</label>
            <select id="areaFilter" onchange="renderItems()" class="px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
            <option value="all">全部</option>
            <option value="京都">京都</option>
            <option value="大阪">大阪</option>
            <option value="奈良">奈良</option>
            <option value="關西延伸">關西延伸</option>
        </select>
        </div>
    </div>
</div>

<div id="itemsContainer" class="items-grid grid grid-cols-1 md:grid-cols-2 gap-4 mb-6"></div>

<div class="result-box bg-white/90 backdrop-blur rounded-2xl p-4 shadow-lg border border-gray-100" id="resultBox">
    <pre id="resultText" class="text-sm text-gray-700 whitespace-pre-wrap max-h-96 overflow-y-auto"></pre>
</div>

<footer class="text-center mt-8 text-gray-400 text-sm">用 Claude Code 整理 | 2026年5月</footer>
</div>

<script>
// 從 localStorage 讀取選擇
function getSelectedAttractions() {
    return JSON.parse(localStorage.getItem('selectedAttractions') || '[]');
}

function getSelectedFoods() {
    return JSON.parse(localStorage.getItem('selectedFoods') || '[]');
}

function saveSelectedAttractions(data) {
    localStorage.setItem('selectedAttractions', JSON.stringify(data));
}

function saveSelectedFoods(data) {
    localStorage.setItem('selectedFoods', JSON.stringify(data));
}

function renderItems() {
    const container = document.getElementById('itemsContainer');
    const typeFilter = document.getElementById('typeFilter').value;
    const areaFilter = document.getElementById('areaFilter').value;

    const attractions = getSelectedAttractions();
    const foods = getSelectedFoods();

    let items = [];

    // 轉換景點
    attractions.forEach(a => {
        items.push({
            type: 'attraction',
            id: a.id || a.name,
            name: a.name,
            city: a.city,
            tags: a.tags || [],
            features: a.features || '',
            price: a.price || '免費',
            duration: a.duration || '',
            hours: a.hours || '',
            transport: a.transport || '',
            link: a.link || ''
        });
    });

    // 轉換美食
    foods.forEach(f => {
        items.push({
            type: 'food',
            id: f.id || f.name,
            name: f.name,
            city: f.area,
            tags: f.type || [],
            features: f.features || '',
            price: f.price || '',
            hours: f.hours || '',
            address: f.address || '',
            link: f.link || ''
        });
    });

    // 篩選
    if (typeFilter !== 'all') {
        items = items.filter(item => item.type === typeFilter);
    }
    if (areaFilter !== 'all') {
        items = items.filter(item => item.city === areaFilter);
    }

    // 更新計數
    document.getElementById('totalCount').textContent = items.length;
    document.getElementById('attractionCount').textContent = attractions.length;
    document.getElementById('foodCount').textContent = foods.length;

    if (items.length === 0) {
        container.innerHTML = `
            <div class="empty-state" style="grid-column: 1/-1;">
                <h2>尚無選擇的項目</h2>
                <p>到景點選擇器或美食選擇器勾選感興趣的項目</p>
                <a href="attractions.html">前往景點選擇器</a>
            </div>
        `;
        return;
    }

    container.innerHTML = items.map(item => {
        const tagsHtml = item.tags.map(t => `<span class="tag-pill" style="background: ${getTagColor(t)}; color: ${getTagTextColor(t)};">${t}</span>`).join('');
        const priceClass = getPriceClass(item.price);
        const mapsUrl = item.link || 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(item.name + ' ' + (item.city || ''));

        let details = '';
        if (item.type === 'attraction') {
            details = `
                ${item.duration ? '<div class="mt-2"><strong class="text-gray-600">停留：</strong>' + item.duration + '</div>' : ''}
                ${item.hours ? '<div><strong class="text-gray-600">時間：</strong>' + item.hours + '</div>' : ''}
                ${item.transport ? '<div><strong class="text-gray-600">交通：</strong>' + item.transport + '</div>' : ''}
            `;
        } else {
            details = `
                ${item.hours ? '<div class="mt-2"><strong class="text-gray-600">時間：</strong>' + item.hours + '</div>' : ''}
                ${item.address ? '<div><strong class="text-gray-600">地址：</strong>' + item.address + '</div>' : ''}
            `;
        }

        return `
            <div class="item-card bg-white rounded-2xl p-5 shadow-md relative ${item.type === 'attraction' ? 'border-l-4 border-green-500' : 'border-l-4 border-orange-500'}" data-id="${item.id}" data-type="${item.type}">
                <div class="flex justify-between items-start mb-3">
                    <h3 class="text-base font-semibold text-gray-800"><a href="${mapsUrl}" target="_blank" class="hover:underline">${item.name}</a></h3>
                    <span class="tag-pill text-xs ${item.type === 'attraction' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}">${item.type === 'attraction' ? '景點' : '美食'}</span>
                </div>
                <div class="flex flex-wrap gap-2 mb-3">${tagsHtml}</div>
                <div class="text-sm text-gray-600 leading-relaxed">
                    ${item.features || ''}
                    ${details}
                    ${item.price ? '<div class="mt-2"><span class="tag-pill text-xs" style="background:' + priceClass.background + '; color:' + priceClass.color + ';">' + item.price + '</span></div>' : ''}
                </div>
                <button class="item-remove absolute top-3 right-3 bg-none border-none text-gray-400 cursor-pointer text-xl hover:text-red-500 transition-colors" onclick="removeItem('${item.type}', '${item.id.replace(/'/g, "\\'")}')" title="移除">✕</button>
            </div>
        `;
    }).join('');
}

function getTagColor(tag) {
    const colors = {
        '京都': '#e8f5e9', '大阪': '#fff3e0', '奈良': '#f3e5f5', '關西延伸': '#e3f2fd',
        '必去': '#ffcdd2', '賞楓': '#ffccbc', '賞花': '#f8bbd9', '夜景': '#e1bee7',
        '美食': '#d7f9d0', '購物': '#fff9c4', '神社寺院': '#ffe0b2',
        '文化體驗': '#b3e5fc', '體驗': '#c8e6c9', '自然': '#c8e6c9',
        '免費': '#c8e6c9', '世界遺產': '#ffecb3', '主題樂園': '#e1f5fe',
        'ACG/玩具': '#f3e5f5', '溫泉': '#e0f7fa',
        '章魚燒': '#ffcdd2', '拉麵': '#ffe0b2', '燒肉': '#f3e5f5',
        '甜點': '#f8bbd9', '海鮮': '#b3e5fc', '大阪燒': '#ffccbc',
        '抹茶': '#d7f9d0', '咖啡': '#fff9c4'
    };
    return colors[tag] || '#f5f5f5';
}

function getTagTextColor(tag) {
    const darkColors = ['賞楓', '賞花', '美食', '免費', '體驗', '自然', '抹茶', '世界遺產'];
    return darkColors.includes(tag) ? '#1b5e20' : '#616161';
}

function getPriceClass(price) {
    if (!price) return '';
    if (price.includes('¥3,000') || price.includes('¥4,000') || price.includes('¥5,000') ||
        price.includes('¥8,000') || price.includes('¥10,000') || price.includes('¥12,000')) {
        return 'high';
    }
    if (price.includes('¥800') || price.includes('¥900') || price.includes('¥1,000') ||
        price.includes('¥1,200') || price.includes('¥1,500') || price.includes('¥2,000')) {
        return 'med';
    }
    return '';
}

function removeItem(type, id) {
    if (type === 'attraction') {
        const attractions = getSelectedAttractions().filter(a => (a.id || a.name) !== id);
        saveSelectedAttractions(attractions);
    } else {
        const foods = getSelectedFoods().filter(f => (f.id || f.name) !== id);
        saveSelectedFoods(foods);
    }
    renderItems();
}

function clearAll() {
    if (confirm('確定要清除所有選擇嗎？')) {
        localStorage.removeItem('selectedAttractions');
        localStorage.removeItem('selectedFoods');
        renderItems();
    }
}

function exportSelected() {
    const resultBox = document.getElementById('resultBox');
    const resultText = document.getElementById('resultText');

    const data = {
        attractions: getSelectedAttractions(),
        foods: getSelectedFoods(),
        exportedAt: new Date().toISOString()
    };

    resultText.textContent = JSON.stringify(data, null, 2);
    resultBox.classList.add('show');
}

// 初始化
renderItems();
</script>
</body>
</html>
